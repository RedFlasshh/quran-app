  <style>
      :root{
            --ink:#1E2B28;
            --parchment:#FBF6EB;
            --parchment-2:#F3EAD3;
            --teal:#0B3D3A;
            --teal-light:#155C56;
            --gold:#C9A24B;
            --gold-light:#E4C97A;
            --line:#D8CBA6;
            --muted:#6B6255;
      }
      *{box-sizing:border-box;}
      body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.6;}
      .wrap{max-width:920px;margin:0 auto;padding:0 20px 80px;}
      header{background:var(--teal);color:var(--parchment);text-align:center;padding:56px 20px 40px;}
      header .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-light);margin:0 0 12px;}
      header h1{font-family:'Amiri',serif;font-size:34px;margin:0 0 10px;}
      header p{font-size:14px;color:var(--parchment-2);max-width:520px;margin:0 auto;}

      .progress-bar{max-width:920px;margin:-20px auto 0;padding:0 20px;position:relative;z-index:2;}
      .progress-track{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
      .progress-fill{height:6px;background:var(--parchment-2);border-radius:4px;flex:1;margin:0 16px;position:relative;overflow:hidden;}
      .progress-fill i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px;}
      .progress-label{font-size:13px;color:var(--muted);white-space:nowrap;}

      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:32px;}
      .s-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;color:var(--ink);position:relative;transition:border-color .15s, transform .15s;}
      .s-card.available:hover{border-color:var(--teal);transform:translateY(-2px);}
      .s-card.locked{opacity:.55;cursor:default;}
      .s-num{font-size:11px;color:var(--muted);margin-bottom:6px;}
      .s-arabic{font-family:'Amiri',serif;font-size:20px;color:var(--teal);margin:0 0 2px;}
      .s-name{font-size:13px;font-weight:500;margin:0 0 2px;}
      .s-meaning{font-size:12px;color:var(--muted);margin:0;}
      .s-badge{position:absolute;top:14px;right:14px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;}
      .s-badge.done{background:var(--gold);color:#4A3512;}
      .s-badge.soon{background:var(--parchment-2);color:var(--muted);}
    </style>

    const grid = document.getElementById('grid');
    let doneCount = 0;

    async function renderGrid(){
        grid.innerHTML = '';
        doneCount = 0;
        const myProgress = await getMyProgress();

        surahs.forEach(s=>{
              const el = document.createElement(s.file ? 'a' : 'div');
              el.className = 's-card ' + (s.file ? 'available' : 'locked');
              if(s.file){ el.href = s.file; doneCount++; }

              const progress = myProgress[s.n];
              let badge = s.file ? 'Ready' : 'Coming soon';
              let badgeClass = s.file ? 'done' : 'soon';
              if(progress && progress.completed_at){
                      badge = 'Completed \u2713';
                      badgeClass = 'done';
              }

              el.innerHTML = `
                    <span class="s-badge ${badgeClass}">${badge}</span>
                          <div class="s-num">Surah ${s.n}</div>
                                <p class="s-arabic">${s.ar}</p>
                                      <p class="s-name">${s.name}</p>
                                            <p class="s-meaning">${s.meaning} · ${s.verses} verses</p>
                                                `;
              grid.appendChild(el);
        });

        const pct = Math.round((doneCount / surahs.length) * 100);
        document.getElementById('prog-count').textContent = doneCount + ' of ' + surahs.length + ' done';
        document.getElementById('prog-pct').textContent = pct + '%';
        document.getElementById('prog-fill').style.width = pct + '%';
    }

    renderGrid();
    sb.auth.onAuthStateChange(()=>{ renderGrid(); });
